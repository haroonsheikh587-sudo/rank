<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator | BrightlyFuture Tools</title>
<meta name="description" content="Generate cryptographically strong passwords with custom length, symbols, and entropy score — free tool by BrightlyFuture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.pw-display {
  background: var(--dark2); border: 2px solid var(--pri);
  border-radius: 12px; padding: 1.25rem 1.5rem;
  font-family: 'Fira Code', monospace; font-size: 1.15rem;
  letter-spacing: 1px; color: var(--white); word-break: break-all;
  min-height: 60px; display: flex; align-items: center;
  justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.pw-display span { flex: 1; }
.copy-btn {
  background: var(--pri); color: #fff; border: none; border-radius: 8px;
  padding: 0.45rem 1rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  white-space: nowrap; transition: background .2s;
}
.copy-btn:hover { background: var(--pri-dark); }
input[type=range] {
  -webkit-appearance: none; width: 100%; height: 6px;
  border-radius: 3px; background: var(--dark2); outline: none;
  accent-color: var(--pri);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--pri); cursor: pointer;
  border: 3px solid var(--dark);
}
.length-display { text-align: center; font-size: 1.5rem; font-weight: 800; color: var(--pri-light); margin: 0.5rem 0; }
.bulk-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.bulk-list li {
  background: var(--dark2); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.65rem 1rem; font-family: 'Fira Code', monospace; font-size: 0.9rem;
  display: flex; justify-content: space-between; align-items: center;
  word-break: break-all; gap: 0.5rem;
}
.bulk-list li button {
  background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; flex-shrink: 0;
}
.bulk-list li button:hover { color: var(--pri-light); }
</style>
</head>
<body>

<div class="tool-page-hero">
  <a href="index.html" class="back-link">← Back to All Tools</a>
  <div style="font-size:2.5rem;margin-bottom:1rem;">🔐</div>
  <h1>Password Generator</h1>
  <p>Create strong, random passwords with custom complexity. Entropy score shows how long it would take to crack.</p>
</div>

<div class="tool-workspace">
  <div class="tool-box">
    <div class="pw-display">
      <span id="pwOutput">Click Generate to create a password</span>
      <button class="copy-btn" onclick="copyPw()">📋 Copy</button>
    </div>

    <!-- Strength Bar -->
    <div style="margin-bottom:1.5rem;">
      <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem;">
        <span style="font-size:0.85rem;color:var(--muted);">Password Strength</span>
        <span id="strengthLabel" style="font-size:0.85rem;font-weight:700;color:var(--muted);">—</span>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%;background:var(--red);"></div></div>
    </div>

    <!-- Entropy -->
    <div class="stats-row" style="margin-bottom:1.5rem;">
      <div class="stat-chip"><div class="val" id="entropyVal">0</div><div class="lbl">Entropy (bits)</div></div>
      <div class="stat-chip"><div class="val" id="charsetVal">0</div><div class="lbl">Charset Size</div></div>
      <div class="stat-chip"><div class="val" id="crackTime">—</div><div class="lbl">Crack Time</div></div>
    </div>

    <!-- Length Slider -->
    <div class="mb">
      <label>Password Length</label>
      <div class="length-display" id="lengthDisplay">16</div>
      <input type="range" id="lengthSlider" min="6" max="64" value="16" oninput="updateLength(this.value)">
      <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--muted);margin-top:0.3rem;"><span>6</span><span>64</span></div>
    </div>

    <!-- Options -->
    <div class="mb">
      <label>Include Character Types</label>
      <div class="check-group">
        <label><input type="checkbox" id="optUpper" checked> Uppercase (A–Z)</label>
        <label><input type="checkbox" id="optLower" checked> Lowercase (a–z)</label>
        <label><input type="checkbox" id="optNumbers" checked> Numbers (0–9)</label>
        <label><input type="checkbox" id="optSymbols" checked> Symbols (!@#…)</label>
        <label><input type="checkbox" id="optAmbiguous"> Exclude Ambiguous (0,O,l,1)</label>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="generatePassword()">⚡ Generate</button>
      <button class="btn btn-secondary" onclick="generateBulk()">📋 Generate 10</button>
    </div>
  </div>

  <!-- Bulk List -->
  <div id="bulkBox" style="display:none;margin-top:1.5rem;">
    <div class="tool-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
        <h3 style="font-size:1rem;">10 Passwords</h3>
        <button class="btn btn-secondary" onclick="copyAll()" style="padding:0.4rem 0.9rem;font-size:0.8rem;">Copy All</button>
      </div>
      <ul class="bulk-list" id="bulkList"></ul>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const LOWER = 'abcdefghijklmnopqrstuvwxyz';
const NUMS  = '0123456789';
const SYMS  = '!@#$%^&*()-_=+[]{}|;:,.<>?';
const AMBIG = /[0O1lI]/g;

function getCharset() {
  let cs = '';
  if (document.getElementById('optUpper').checked) cs += UPPER;
  if (document.getElementById('optLower').checked) cs += LOWER;
  if (document.getElementById('optNumbers').checked) cs += NUMS;
  if (document.getElementById('optSymbols').checked) cs += SYMS;
  if (document.getElementById('optAmbiguous').checked) cs = cs.replace(AMBIG, '');
  return cs || LOWER;
}

function generatePassword(len) {
  len = len || parseInt(document.getElementById('lengthSlider').value);
  const cs = getCharset();
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  const pw = Array.from(arr).map(n => cs[n % cs.length]).join('');
  document.getElementById('pwOutput').textContent = pw;
  updateStats(pw, cs);
  return pw;
}

function updateLength(v) {
  document.getElementById('lengthDisplay').textContent = v;
}

function updateStats(pw, cs) {
  const csLen = cs.length;
  const entropy = Math.round(pw.length * Math.log2(csLen));
  document.getElementById('entropyVal').textContent = entropy;
  document.getElementById('charsetVal').textContent = csLen;

  // Crack time estimate at 10 billion guesses/sec
  const combinations = Math.pow(csLen, pw.length);
  const seconds = combinations / 2 / 1e10;
  let crackLabel;
  if (seconds < 60) crackLabel = '<1 min';
  else if (seconds < 3600) crackLabel = Math.round(seconds/60) + ' min';
  else if (seconds < 86400) crackLabel = Math.round(seconds/3600) + ' hrs';
  else if (seconds < 31536000) crackLabel = Math.round(seconds/86400) + ' days';
  else if (seconds < 3.15e9) crackLabel = Math.round(seconds/31536000) + ' yrs';
  else crackLabel = '∞';
  document.getElementById('crackTime').textContent = crackLabel;

  // Strength
  let strength, color, pct;
  if (entropy < 40) { strength = 'Weak'; color = 'var(--red)'; pct = 25; }
  else if (entropy < 60) { strength = 'Fair'; color = 'var(--yellow)'; pct = 50; }
  else if (entropy < 80) { strength = 'Good'; color = 'var(--cyan)'; pct = 75; }
  else { strength = 'Very Strong'; color = 'var(--green)'; pct = 100; }

  document.getElementById('strengthLabel').textContent = strength;
  document.getElementById('strengthLabel').style.color = color;
  document.getElementById('strengthFill').style.width = pct + '%';
  document.getElementById('strengthFill').style.background = color;
}

function copyPw() {
  const pw = document.getElementById('pwOutput').textContent;
  navigator.clipboard.writeText(pw).then(() => showToast('Password copied!'));
}

function generateBulk() {
  const len = parseInt(document.getElementById('lengthSlider').value);
  const passwords = Array.from({length:10}, () => {
    const cs = getCharset();
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    return Array.from(arr).map(n => cs[n % cs.length]).join('');
  });
  const ul = document.getElementById('bulkList');
  ul.innerHTML = passwords.map((p, i) =>
    `<li><span>${p}</span><button onclick="navigator.clipboard.writeText('${p}').then(()=>showToast('Copied!'))" title="Copy">📋</button></li>`
  ).join('');
  document.getElementById('bulkBox').style.display = '';
  window._bulkPasswords = passwords;
}

function copyAll() {
  if (window._bulkPasswords) {
    navigator.clipboard.writeText(window._bulkPasswords.join('\n')).then(() => showToast('All passwords copied!'));
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Auto-generate on load
generatePassword();
</script>
</body>
</html>
